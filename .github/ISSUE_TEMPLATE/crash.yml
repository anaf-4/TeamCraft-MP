name: Crash
description: Report a crash in TeamCraft-MP (not plugins)
title: Server crashed
body:
  - type: markdown
    attributes:
      value: |
        > [!CAUTION]
        > 크래시가 네트워크를 통해 유발될 수 있는 것(플레이어/핵클라이언트에 의한 것)이라면 여기에 올리지 마세요.
        >
        > 먼저 [Security Policy](https://github.com/anaf-4/TeamCraft-MP/blob/stable/SECURITY.md)를 읽어주세요.
        > [!TIP]
        > 크래시덤프 원문을 이슈에 그대로 붙여넣지 마세요.
        >
        > 대신 [GitHub Gist](https://gist.github.com)나 [Pastebin](https://pastebin.com) 같은 곳에 올리고 링크를 공유해주세요.
  - type: input
    id: crashdump-url
    attributes:
      label: Link to crashdump
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional comments (optional)
      description: Any other information that might help us solve the problem