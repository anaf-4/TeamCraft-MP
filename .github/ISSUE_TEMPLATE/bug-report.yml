name: Bug report
description: Report a feature of TeamCraft-MP not working as expected
body:
  - type: markdown
    attributes:
      value: |
        ## Plugin information
        > [!IMPORTANT]
        > 이슈를 올리기 전에 플러그인 없이도 재현되는 버그인지 먼저 확인해주세요.
        > 플러그인이 원인인 버그로 인해 유지보수자의 시간을 낭비하지 않도록 도와주세요.
  - type: dropdown
    attributes:
      label: Plugin information
      options:
        - "I haven't tested without plugins"
        - Bug happens without plugins
        - Bug only happens with certain plugins (describe below)
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Bug description
        > [!TIP]
        > 도움이 되는 정보:
        > - 재현 절차
        > - 에러/크래시 로그
        > - 문제를 유발하는 플러그인 코드
        > - 설치된 플러그인 목록 (/plugins 명령어)
        > [!IMPORTANT]
        > **재현 절차가 없으면 원인 파악이 어려워 이슈가 닫힐 수 있습니다.**
  - type: textarea
    attributes:
      label: Problem description
      description: Describe the problem, and how you encountered it
      placeholder: e.g. Steps to reproduce the issue
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Version, OS and game info
        > [!WARNING]
        > "Latest"는 유효한 버전 정보가 아닙니다.
        > 정확한 정보를 채우지 않으면 이슈가 닫힐 수 있습니다.
  - type: input
    attributes:
      label: TeamCraft-MP version
      placeholder: 콘솔에서 /version 명령어로 확인
    validations:
      required: true
  - type: input
    attributes:
      label: PHP version
      placeholder: 콘솔에서 /version 명령어로 확인
    validations:
      required: true
  - type: input
    attributes:
      label: Server OS
      placeholder: 콘솔에서 /version 명령어로 확인
    validations:
      required: true
  - type: input
    attributes:
      label: Game version (if applicable)
      placeholder: e.g. Android, iOS, Windows, Xbox, PS4, Switch
    validations:
      required: false