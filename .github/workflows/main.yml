name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  # TeamCraft-MP는 개인이 유지보수하는 프로젝트라, 원본 PMMP처럼 PHP 8.1~8.5 전체
  # 매트릭스를 매번 돌리지 않고 실제 개발/배포에 쓰는 버전(8.4)만 검증합니다.
  main:
    name: PHP 8.4
    uses: ./.github/workflows/main-php-matrix.yml
    with:
      php: "8.4"
    secrets: inherit
  codestyle:
    name: Code Style checks
    runs-on: ubuntu-22.04
    continue-on-error: true # 개인 프로젝트라 스타일 불일치로 PR을 막지는 않음 (참고용)
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP and tools
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.4
          tools: php-cs-fixer:3.75
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run PHP-CS-Fixer
        run: php-cs-fixer fix --dry-run --diff --ansi
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
  translations:
    name: Translation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: 8.4
      - name: Verify translations
        run: php .github/workflows/verify-translations.php ${{ github.workspace }}/resources/translations